<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loteria - Settings</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    
    <!-- header that is displayed for every page-->
    <header>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html" aria-current="page">Home</a></li>
                <li><a href="players.html">Players</a></li>
                <li><a href="game.html">Game</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </nav>
    </header>

    <!-- main content for settings page-->
    <main>

        <section id="settings-page">

            <h2>Settings</h2>

            <!-- display how the settings will bevdisplayed-->
            <div class="settings-layout">

                <nav id="settings-sidebar" aria-label="Settings navigation">
                    <ul>
                        <li><a href="#game-settings">Game Settings</a></li>
                        <li><a href="#voice-settings">Voice/Audio</a></li>
                        <li><a href="#language-settings">Language</a></li>
                        <li><a href="#deck-settings">Deck Options</a></li>
                    </ul>
                </nav>

                <!-- form for settings to be displayed-->
                <form id="settings-form">
                    <section id="game-settings">
                        <h3>Game Settings</h3>

                        <!-- calling speed settings-->
                        <fieldset>
                            <legend>Calling Speed</legend>

                            <label>
                                <input type="radio" name="call-speed" value="slow">
                                Slow
                            </label>
                            <label>
                                <input type="radio" name="call-speed" value="medium">
                                Medium
                            </label>
                            <label>
                                <input type="radio" name="call-speed" value="fast">
                                Fast
                            </label>
                        </fieldset>

                        <!-- automatic calling settings-->
                        <fieldset>

                            <legend>Auto Call</legend>

                            <label> <input type="radio" name="auto-calling-setting" value="on">On</label>

                            <label><input type="radio" name="auto-calling-setting" value="off">Off</label>

                        </fieldset>
                    </section>

                    <!-- voice and audio settings for the calling-->
                     <section id="voice-settings">
                        <h3>Voice/Audio</h3>

                        <fieldset>
                            <legend>Card Voice</legend>

                            <!-- settings to turn the audio on or off-->
                            <label><input type="radio" name="card-voice" value="on" checked>On</label>

                            <label><input type="radio" name="card-voice" value="off">Off</label>

                        </fieldset>
                            <!-- volume settings-->
                            <label for="voice-volume">Voice Volume</label>
                            <input type="range" id="voice-volume" name="voice-volume" min="0" max="100" value="75">

                     </section>

                     <!-- language settings. hopefully this can work as i'd like to so that it can stay-->
                    <section id="language-settings">
                        <h3>Language</h3>

                        <label for="settings-language">Select Language</label>

                        <select name="language" id="settings-language">
                            <option value="en">English</option>
                            <option value="es">Spanish</option>
                        </select>

                    </section>

                    <!-- deck settings for user to select-->
                    <section id="deck-settings">

                        <h3>Deck Options</h3>

                        <label for="deck-settings" name="deck-style"></label>

                        <select name="deck-style" id="deck-settings">
                            <option value="classic">Classic</option>
                        </select>

                        <fieldset>
                            <legend>Display Card Numbers</legend>

                            <label> <input type="radio" name="card-numbers" value="on" checked>On</label>

                            <label><input type="radio" name="card-numbers" value="off">Off</label>

                        </fieldset>
                    </section>

                    <!-- section in settings to save the selected settings-->
                    <div class="settings-actions">
                        <button type="submit" id="save-settings">Save Settings</button>
                    </div>

                </form>
            </div>
        </section>

    </main>

    <!-- shared footer in all pages-->
    <footer>
        <nav aria-label="footer-navigation">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#help">Help</a></li>
            </ul>
     </footer>

</body>
</html>
